services:
  backend:
    build: ./backend
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/pdv.db
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no .env}
    volumes:
      - pdv_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pdv_data:
